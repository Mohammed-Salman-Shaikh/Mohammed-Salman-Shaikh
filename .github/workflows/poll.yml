name: Update portfolio rating poll

on:
  issues:
    types: [opened, edited, deleted, transferred]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/scripts/poll-badges.js
      - .github/workflows/poll.yml

permissions:
  contents: write
  issues: read

concurrency:
  group: poll-badges
  cancel-in-progress: false

jobs:
  badges:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Count votes and draw badges
        uses: actions/github-script@v7
        with:
          script: |
            const run = require('./.github/scripts/poll-badges.js');
            await run({ github, context });

      - name: Publish badges to the poll-output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: poll-output
          build_dir: poll
          commit_message: "Update portfolio rating poll"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
